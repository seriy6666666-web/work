# Заголовок Connection зависит от запроса, а не задаётся раз и навсегда.
#
# У живых обновлений два канала: WebSocket и обычные HTTP-запросы, на которые
# socket.io откатывается там, где WebSocket режут. Раньше здесь стояло жёсткое
# Connection "upgrade" — для запросов запасного канала, где заголовка Upgrade нет,
# это означало просьбу перейти на протокол, которого никто не просил. То есть сам
# откат был бы бесполезен ровно в тех сетях, ради которых он и нужен.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Загрузка файлов импорта — рабочие файлы Excel бывают по нескольку МБ.
    client_max_body_size 25m;

    # API и WebSocket проксируются на бэкенд, поэтому приложение целиком живёт на
    # одном источнике: браузеру не нужен CORS, а снаружи открыт всего один порт.
    # Раньше интерфейс и API отвечали на разных портах, и каждый адрес приходилось
    # прописывать в CORS_ORIGIN вручную.
    location /api/ {
        # Слеш на конце обязателен: он срезает префикс /api, и бэкенд получает
        # свои обычные пути (/auth/login, а не /api/auth/login).
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Настоящий адрес клиента: по нему бэкенд считает лимит входов. Без этого
        # все запросы выглядели бы как приходящие с одного адреса — прокси, — и
        # один планшет расходовал бы лимит на всю смену.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        # Без этих двух заголовков соединение не переходит в WebSocket, и доска
        # распределения перестаёт обновляться сама.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Запасной канал держит запрос открытым до события: с коротким таймаутом
        # соединение рвалось бы каждые минуту, и доска мигала бы «нет связи».
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # Файлы сборки названы по содержимому (index-DgqhJxiH.js): при каждом
    # обновлении имя другое, поэтому их можно кэшировать сколь угодно долго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # index.html кэшировать нельзя: его имя не меняется, а внутри — ссылки на
        # файлы сборки. Без этого заголовка браузер решает сам, и планшет способен
        # неделю работать на старой версии: выпущенное исправление до цеха просто
        # не доезжает, а выглядит это как «у меня всё по-прежнему не работает».
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
