# Значения по умолчанию рассчитаны на локальную разработку и показ.
# Что обязательно переопределить в .env перед рабочим запуском — см. .env.example.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-belmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-belmy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-belmy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Только для локальных psql/DBeaver. Наружу база не смотрит: без 127.0.0.1
      # Docker публикует порт на всех интерфейсах, и БД видна из сети предприятия.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-belmy}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-belmy}:${POSTGRES_PASSWORD:-belmy_dev_password}@postgres:5432/${POSTGRES_DB:-belmy}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # true  — создать демо-участки и сотрудников с паролем password123 (разработка, показ);
      # false — только первый администратор из ADMIN_USERNAME/ADMIN_PASSWORD (рабочий запуск).
      # Этот же флаг разрешает слабые секреты: при false бэкенд с ними не стартует.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Сколько прокси перед приложением: caddy + nginx фронтенда. Нужно, чтобы лимит
      # входов считался по адресу планшета, а не по адресу прокси на всех сразу.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      # Сколько дней хранить журнал действий. Он пишется на каждое изменение и на
      # каждый отказ, то есть растёт всё время работы и сам не уменьшается.
      # 0 — не чистить никогда.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      PORT: 3000
    ports:
      # Только для локальных проверок и e2e-тестов с этого же компьютера. Наружу
      # бэкенд не смотрит: снаружи всё идёт через caddy по HTTPS. Заодно это значит,
      # что заголовок X-Forwarded-For нельзя подделать из сети в обход прокси.
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        # Относительный адрес: интерфейс и API отдаются с одного источника, API
        # проксирует nginx фронтенда. Поэтому CORS не нужен и адрес сервера не
        # вшивается в сборку — один и тот же образ работает на любом адресе.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Тоже только локально: снаружи вход через caddy по HTTPS, иначе люди будут
      # заходить по http:// и шифрование окажется бесполезным.
      - '127.0.0.1:5173:80'

  caddy:
    # Шифрование (HTTPS) для доступа с планшетов и телефонов. Единственный сервис,
    # который смотрит в сеть. Настройки — в ./Caddyfile.
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      # Адреса, на которые выписывать сертификат. Через запятую, со схемой.
      SERVER_HOST: ${SERVER_HOST:-https://192.168.8.52}
      # Тот же адрес без схемы — какой сертификат подавать, если клиент не сообщил
      # имя сервера. При обращении по IP браузер SNI не отправляет.
      SERVER_NAME: ${SERVER_NAME:-192.168.8.52}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты и корневой центр сертификации переживают пересоздание контейнера:
      # иначе на планшетах пришлось бы заново ставить корневой сертификат.
      - caddy_data:/data
      - caddy_config:/config

  backup:
    # Версия обязана совпадать с postgres выше. Без тега образ тянул pg_dump 18 к
    # серверу 16: дамп получался с директивами новых версий, и восстановление падало
    # с «unrecognized configuration parameter transaction_timeout». Данные при этом
    # доезжали, но ошибка в выводе приучает не смотреть в него — и настоящий сбой
    # восстановления пройдёт незамеченным.
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-belmy}
      POSTGRES_USER: ${POSTGRES_USER:-belmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-belmy_dev_password}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./backups:/backups

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
