# Значения по умолчанию рассчитаны на локальную разработку и показ.
# Что обязательно переопределить в .env перед рабочим запуском — см. .env.example.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-belmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-belmy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-belmy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Только для локальных psql/DBeaver. Наружу база не смотрит: без 127.0.0.1
      # Docker публикует порт на всех интерфейсах, и БД видна из сети предприятия.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-belmy}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-belmy}:${POSTGRES_PASSWORD:-belmy_dev_password}@postgres:5432/${POSTGRES_DB:-belmy}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # true  — создать демо-участки и сотрудников с паролем password123 (разработка, показ);
      # false — только первый администратор из ADMIN_USERNAME/ADMIN_PASSWORD (рабочий запуск).
      # Этот же флаг разрешает слабые секреты: при false бэкенд с ними не стартует.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PORT: 3000
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '5173:80'

  backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-belmy}
      POSTGRES_USER: ${POSTGRES_USER:-belmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-belmy_dev_password}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./backups:/backups

volumes:
  postgres_data:
